<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 Year Old Adventures: DC — 108 rain-or-shine stops for toddlers</title>
<meta name="description" content="108 rain-or-shine stops for toddlers around Washington, DC — play spaces, museums, animals, books, classes, and shows, mapped from Gallery Place.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23EE352E'/><text x='50' y='72' font-size='52' text-anchor='middle'>&#x1F338;</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1A1A1A;--paper:#F5F1E8;--card:#FFFFFF;
  --red:#EE352E;--red-deep:#C7241E;--orange:#FF6319;--yellow:#FCCC0A;--green:#00933C;
  --blue:#0039A6;--purple:#B933AD;--lgreen:#6CBE45;
  --muted:#6F6857;--rule:#1A1A1A;
}
html,body{height:100dvh;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* ── HEADER: station signage ── */
.hdr{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1001;border-bottom:4px solid #fff}
.hdr .logo{width:42px;height:42px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:2px solid #fff}
.hdr h1{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.hdr .sub{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#B8B2A4;margin-top:3px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:7px 14px;min-width:0}
.search svg{width:14px;height:14px;color:var(--ink);flex-shrink:0}
.search input{border:0;background:0;outline:0;font:inherit;font-size:13px;font-weight:500;color:var(--ink);width:160px;min-width:0}
.search input::placeholder{color:#999}
.q-x{border:0;background:0;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;font-family:inherit;line-height:1;width:26px;height:26px;margin:-4px -8px -4px 0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.q-x:hover{color:var(--ink);background:#EFE9DB}
.q-x[hidden]{display:none}
.city-nav{display:flex;gap:5px;margin-left:2px;flex-shrink:0}
.city{font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 11px;border-radius:999px;border:1.5px solid #fff;color:#fff;text-decoration:none;transition:background .12s,color .12s}
.city:hover{background:var(--red);border-color:var(--red)}
.city.on{background:#fff;color:var(--ink)}
.city.on:hover{background:#fff;color:var(--ink);border-color:#fff}
.cnt-badge{background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;flex-shrink:0;white-space:nowrap}
.cnt-badge small{font-weight:500;font-size:10px;letter-spacing:.5px}

/* ── TOOLBAR ── */
.toolbar{background:var(--paper);border-bottom:2px solid var(--ink);position:relative;z-index:1001}
.trow{display:flex;flex-wrap:wrap;gap:6px;padding:9px 20px;align-items:center}
.trow .spacer{flex:1;min-width:8px}
.pill{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;flex-shrink:0;font-family:inherit;display:flex;align-items:center;gap:7px}
.pill:hover{background:#EFE9DB}
.pill.on{background:var(--ink);color:#fff}
.pill .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
.pill[data-v="play"].on{background:var(--orange);border-color:var(--orange);color:#fff}
.pill[data-v="museum"].on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill[data-v="nature"].on{background:var(--green);border-color:var(--green);color:#fff}
.pill[data-v="books"].on{background:var(--purple);border-color:var(--purple);color:#fff}
.pill[data-v="classes"].on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.pill[data-v="shows"].on{background:var(--lgreen);border-color:var(--lgreen);color:#fff}
.pill.on .dot{border-color:rgba(255,255,255,.6)}
.pill.today::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--red)}
.pill.today.on::after{background:#fff}
.fcount{background:var(--red-deep);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fcount[hidden]{display:none}
.pill.on .fcount{background:#fff;color:var(--ink)}
.fav-pill.on{background:var(--red-deep);border-color:var(--red-deep);color:#fff}
.fpanel{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:2px solid var(--ink);padding:14px 20px 16px;display:flex;flex-wrap:wrap;gap:16px 30px;z-index:1100;box-shadow:0 10px 20px rgba(26,26,26,.12)}
.fpanel[hidden]{display:none}
.fgrp h5{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.seg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.factions{display:flex;gap:8px;margin-left:auto;align-self:flex-end}
.slider-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;height:31px}
.slider-lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;min-width:74px}
.slider{-webkit-appearance:none;width:90px;height:4px;border-radius:2px;background:var(--ink);outline:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);cursor:pointer}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);cursor:pointer}
.sortsel{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);padding:6px 10px;cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none}

/* ── LAYOUT ── */
.main{display:flex;flex-direction:column;flex:1;min-height:0}
#map{height:38%;min-height:200px;flex-shrink:0;border-bottom:2px solid var(--ink)}
.list-wrap{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.foot-note{grid-column:1/-1;text-align:center;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;padding:18px 0 8px}

/* ── CARDS ── */
.vc{background:var(--card);border:1.5px solid var(--ink);border-radius:2px;padding:14px 16px;cursor:pointer;transition:box-shadow .12s,transform .12s;display:flex;flex-direction:column;gap:9px;position:relative}
.vc::before{content:"";position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;width:5px;background:var(--gc,var(--ink))}
.vc:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.vc.on{box-shadow:4px 4px 0 var(--gc,var(--ink));transform:translate(-2px,-2px);border-width:2px}
.fav-btn{position:relative;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);cursor:pointer;font-size:13px;line-height:1;color:var(--muted);flex-shrink:0;font-family:inherit;padding:0;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.fav-btn::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.fav-btn:hover{background:#EFE9DB;color:var(--red)}
.fav-btn.on{background:var(--red);border-color:var(--red);color:#fff}
.vc .vc-top{display:flex;align-items:center;gap:11px}
.bullet{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.vc .vc-title{flex:1;min-width:0}
.vc .nm{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%;max-width:100%;background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.vc .nm:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.vc .cat-line{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .vc-price{text-align:right;flex-shrink:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.vc .vc-price.free{color:var(--green)}
.vc .desc-line{font-size:13px;color:#3D3A30;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .meta{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.vc .meta .ok{color:var(--green)}
.vc .meta .no{color:var(--red)}

/* ── HOME POPUP ── */
.leaflet-popup-content-wrapper{border-radius:2px!important;box-shadow:5px 5px 0 rgba(26,26,26,.85)!important;padding:0!important;overflow:hidden;border:2px solid var(--ink)!important}
.leaflet-popup-tip{display:none}
.leaflet-popup-content{margin:0!important;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}

/* ── DETAIL SHEET ── */
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);z-index:1200;transform:translateY(108%);transition:transform .22s ease,visibility 0s .22s;max-height:62dvh;display:flex;flex-direction:column;visibility:hidden}
#sheet.open{transform:translateY(0);visibility:visible;transition:transform .22s ease}
.sh-h{background:var(--ink);color:#fff;padding:13px 16px;display:flex;gap:11px;align-items:center;flex-shrink:0}
.sh-h .bullet{border:2px solid #fff;width:32px;height:32px}
.sh-t{flex:1;min-width:0}
.sh-h h3{font-size:16px;font-weight:700;line-height:1.25;letter-spacing:-.2px}
.sh-h .cat{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:#B8B2A4;margin-top:3px;font-weight:700}
.sh-x{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;line-height:1;font-family:inherit;padding:0}
.sh-x:hover{background:var(--red);border-color:var(--red)}
.sh-b{padding:14px 16px;overflow-y:auto;font-size:13px;line-height:1.55;color:#3D3A30}
.sh-b .desc{margin-bottom:12px}
.sh-meta{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:13px;padding-bottom:13px;border-bottom:1.5px solid var(--ink)}
.sh-meta .ok{color:var(--green)}
.sh-meta .no{color:var(--red)}
.sh-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.sh-b h4{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink);margin-bottom:6px}
.sh-b .hr-row{display:flex;gap:8px;padding:1px 0;font-size:12px}
.sh-b .hr-row .d{width:36px;font-weight:700;color:var(--ink);flex-shrink:0}
.sh-b .hr-row.tdy{background:var(--paper);margin:0 -6px;padding:1px 6px}
.sh-b .hr-row .closed{color:var(--red);font-weight:700}
.sh-b .pr-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:12px}
.sh-b .pr-row .v{font-weight:700;text-align:right}
.sh-b .note{font-size:11px;color:var(--green);margin-top:6px;font-weight:700}
.sh-f{padding:11px 16px;background:var(--paper);border-top:2px solid var(--ink);display:flex;gap:8px;flex-shrink:0}
.sh-f .btn{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#fff;text-decoration:none;padding:9px 10px;background:var(--ink);border-radius:999px;white-space:nowrap;border:0;cursor:pointer;font-family:inherit;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sh-f .btn:hover{background:var(--red)}
.sh-f .btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sh-f .btn.alt:hover{background:var(--ink);color:#fff}
.sh-f .btn.save{flex:0 0 auto;min-width:78px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sh-f .btn.save:hover{color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);background:#fff}
.sh-f .btn.save.on{background:var(--red-deep);color:#fff;box-shadow:none}
.sh-f .btn.save.on:hover{background:var(--red-deep);color:#fff}
#sheet:focus{outline:none}

/* ── MAP MARKERS ── */
.cm{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.35);border:2px solid #fff}
.cm.home{background:var(--red);width:40px;height:40px;font-size:19px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cm{cursor:pointer;transition:transform .15s}
.cm.sel{transform:scale(1.3);box-shadow:0 0 0 3px var(--ink),0 2px 8px rgba(0,0,0,.4)}
.leaflet-container{background:#EAE6DB;font-family:inherit}

.empty-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:2}
.empty-msg span{display:block;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;line-height:44px;margin:0 auto 14px}

/* ── RESPONSIVE ── */
@media(min-width:769px){
  .main{flex-direction:row}
  #map{height:100%!important;width:46%;flex:none;order:2;border-bottom:0;border-left:2px solid var(--ink)}
  .list-wrap{flex:1;order:1;padding:16px 20px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search input{width:200px}
  #sheet{left:auto;right:14px;bottom:14px;width:370px;border:2px solid var(--ink);box-shadow:5px 5px 0 rgba(26,26,26,.85);max-height:calc(100dvh - 200px)}
}
@media(min-width:1500px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  #map{width:42%}
}
@media(max-width:768px){
  .hdr{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .hdr h1{font-size:17px}
  .hdr .logo{width:34px;height:34px;font-size:17px}
  .hdr .sub{font-size:8px;letter-spacing:1.2px}
  .cnt-badge{margin-left:auto}
  .search{order:5;flex-basis:100%;margin-left:0}
  .search input{flex:1;width:auto}
  .trow{padding:8px 14px;gap:5px}
  .pill{padding:5px 11px;font-size:11px}
  .fpanel{padding:12px 14px 14px;gap:13px 22px}
  .grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="hdr">
  <span class="logo">&#x1F338;</span>
  <div><h1>2 Year Old Adventures</h1><div class="sub">Gallery Pl&ndash;Chinatown &middot; 108 rain-or-shine stops for toddlers</div></div>
  <nav class="city-nav" aria-label="City"><a class="city" href="index.html">NYC</a><a class="city on" href="dc.html" aria-current="page">DC</a></nav>
  <span class="cnt-badge" aria-live="polite" aria-atomic="true"><b id="count">108</b> <small>STOPS</small></span>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="q" placeholder="Search stops, places, addresses&hellip;" aria-label="Search stops, places, addresses"><button class="q-x" id="q-clear" aria-label="Clear search" hidden>&#x2715;</button></div>
</div>
<div class="toolbar">
  <div class="trow">
    <button class="pill on" data-g="g" data-v="any">All stops</button>
    <button class="pill" data-g="g" data-v="play"><span class="dot" style="background:#FF6319"></span>Play</button>
    <button class="pill" data-g="g" data-v="museum"><span class="dot" style="background:#0039A6"></span>Museums</button>
    <button class="pill" data-g="g" data-v="nature"><span class="dot" style="background:#00933C"></span>Animals</button>
    <button class="pill" data-g="g" data-v="books"><span class="dot" style="background:#B933AD"></span>Books</button>
    <button class="pill" data-g="g" data-v="classes"><span class="dot" style="background:#FCCC0A"></span>Classes</button>
    <button class="pill" data-g="g" data-v="shows"><span class="dot" style="background:#6CBE45"></span>Shows</button>
    <span class="spacer"></span>
    <button class="pill" id="open-today" aria-pressed="false">Open today</button>
    <button class="pill" id="io-indoor" aria-pressed="false">&#x1F3E0; Indoor</button>
    <button class="pill" id="io-outdoor" aria-pressed="false">&#x2600;&#xFE0F; Outdoor</button>
    <button class="pill" id="free-only" aria-pressed="false">Free</button>
    <button class="pill fav-pill" id="fav-only" aria-pressed="false">&hearts; Saved <span class="fcount" id="favcount" hidden></span></button>
    <button class="pill" id="fbtn">Filters <span class="fcount" id="fcount" hidden></span> &#x25BE;</button>
    <select class="sortsel" id="sort" aria-label="Sort by"><option value="near">Sort: Nearest</option><option value="price">Sort: Cheapest</option><option value="name">Sort: A&ndash;Z</option></select>
    <button class="pill" id="surprise" title="Pick a random stop that matches your filters">&#x1F3B2; Surprise me</button>
  </div>
  <div class="fpanel" id="fpanel" hidden>
    <div class="fgrp"><h5>Day of week</h5><div class="seg">
      <button class="pill on" data-g="day" data-v="any">Any</button>
      <button class="pill" data-g="day" data-v="0">Mon</button>
      <button class="pill" data-g="day" data-v="1">Tue</button>
      <button class="pill" data-g="day" data-v="2">Wed</button>
      <button class="pill" data-g="day" data-v="3">Thu</button>
      <button class="pill" data-g="day" data-v="4">Fri</button>
      <button class="pill" data-g="day" data-v="5">Sat</button>
      <button class="pill" data-g="day" data-v="6">Sun</button>
    </div></div>
    <div class="fgrp"><h5>Trip from home</h5><div class="seg">
      <button class="pill on" data-g="t" data-v="99">Any</button>
      <button class="pill" data-g="t" data-v="15">&le;15 min</button>
      <button class="pill" data-g="t" data-v="30">&le;30 min</button>
    </div></div>
    <div class="fgrp"><h5>Space</h5><div class="seg">
      <button class="pill on" data-g="io" data-v="any">Any</button>
      <button class="pill" data-g="io" data-v="indoor">Indoor</button>
      <button class="pill" data-g="io" data-v="outdoor">Outdoor</button>
    </div></div>
    <div class="fgrp"><h5>Type</h5><div class="seg">
      <button class="pill on" data-g="tp" data-v="any">Any</button>
      <button class="pill" data-g="tp" data-v="play">Open play</button>
      <button class="pill" data-g="tp" data-v="class">Classes</button>
    </div></div>
    <div class="fgrp"><h5>Price</h5><div class="seg slider-wrap"><span class="slider-lbl" id="price-lbl">Any price</span><input type="range" id="price-slider" min="0" max="100" value="100" step="5" class="slider"></div></div>
    <div class="fgrp"><h5>Grown-ups</h5><div class="seg"><button class="pill" data-g="af" data-v="1">Adults enjoy too</button></div></div>
    <div class="factions"><button class="pill" id="freset">Reset all</button><button class="pill on" id="fdone">Done</button></div>
  </div>
</div>
<div class="main">
  <div id="map"></div>
  <div class="list-wrap" id="list-wrap"><div class="grid" id="grid"></div></div>
</div>
<div id="sheet" role="dialog" aria-label="Venue details" tabindex="-1"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const today=new Date().getDay();
const todayIdx=today===0?6:today-1;
let filters={day:"any",io:"any",tp:"any",pr:100,af:"any",g:"any",t:99,fav:false};
let sortBy="near";

// Saved stops — persisted in localStorage
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem('tya-favs-dc')||'[]'))}catch(e){}
function saveFavs(){try{localStorage.setItem('tya-favs-dc',JSON.stringify([...favs]))}catch(e){}}
function toggleFav(id){
  if(favs.has(id))favs.delete(id);else favs.add(id);
  const refocus=document.activeElement&&document.activeElement.classList.contains('fav-btn');
  saveFavs();syncQuick();render();updateSheetSave();
  if(refocus){

// Category groups — colored like subway lines
const GC={play:"#FF6319",museum:"#0039A6",nature:"#00933C",books:"#B933AD",classes:"#FCCC0A",shows:"#6CBE45"};
function grp(v){
  const c=v.cat;
  if(/Museum|Landmark|Immersive/.test(c))return"museum";
  if(/Zoo|Aquarium|Nature|Garden|Farm|Animals/.test(c))return"nature";
  if(/Library|Bookstore/.test(c))return"books";
  if(/Gym|Classes|Swim|Yoga|Sports|Workshop|Cooking|Community/.test(c))return"classes";
  if(/Music|Theater|Dance/.test(c))return"shows";
  return"play";
}
function bullet(v,extra){const g=grp(v);const fg=g==="classes"?"#1A1A1A":"#fff";return`<div class="bullet ${extra||''}" style="background:${GC[g]};color:${fg}">${v.id}</div>`;}

function isOpenDay(v,di){if(di==="any")return true;const h=v.days[parseInt(di)];return h!==null&&h!=="v";}
function matchF(v){
  if(filters.fav&&!favs.has(v.id))return false;
  if(filters.g!=="any"&&grp(v)!==filters.g)return false;
  if(filters.day!=="any"&&!isOpenDay(v,filters.day))return false;
  if(filters.t<99&&v.t>filters.t)return false;
  if(filters.io==="indoor"&&v.io==="o")return false;
  if(filters.io==="outdoor"&&v.io==="i")return false;
  if(filters.tp==="play"&&v.tp==="c")return false;
  if(filters.tp==="class"&&v.tp==="p")return false;
  if(filters.pr<100&&v.$>filters.pr)return false;
  if(filters.af==="1"&&!v.af)return false;
  return true;
}
function openSt(v){const h=v.days[todayIdx];if(!h)return{o:false,t:"Closed today"};if(h==="v")return{o:true,t:"Check schedule"};return{o:true,t:"Open "+h+" today"};}
function fmtP(v){return v.$===0?"Free":"$"+v.$;}

const map=L.map('map',{zoomControl:false}).setView([38.8983,-77.0219],12);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',maxZoom:19}).addTo(map);
L.marker([38.8983,-77.0219],{icon:L.divIcon({className:'',html:'<div class="cm home">🌸</div>',iconSize:[40,40],iconAnchor:[20,20],popupAnchor:[0,-20]}),zIndexOffset:1000}).addTo(map).bindPopup('<div style="padding:12px 16px;text-align:center;font-size:13px"><b>Gallery Place &amp; 7th St</b><br><span style="color:#6F6857;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase">Home base</span></div>');

const MK={};
D.forEach(v=>{
  const g=grp(v);const fg=g==="classes"?"#1A1A1A":"#fff";
  const mk=L.marker([v.lt,v.ln],{icon:L.divIcon({className:'',html:`<div class="cm" style="background:${GC[g]};color:${fg}">${v.id}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
  mk.on('click',()=>select(v,'map'));
  MK[v.id]=mk;
});

// ── Detail sheet ──
const sheet=document.getElementById('sheet');
let selId=null;
function clearSel(){
  selId=null;
  document.querySelectorAll('.vc.on').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cm.sel').forEach(x=>x.classList.remove('sel'));
}
function closeSheet(){
  const wasOpen=sheet.classList.contains('open');
  const card=selId!=null?document.querySelector(`.vc[data-id="${selId}"] .nm`):null;
  sheet.classList.remove('open');clearSel();
  if(wasOpen&&sheet.contains(document.activeElement))(card||document.getElementById('fav-only')).focus({preventScroll:true});
}
function updateSheetSave(){
  const b=sheet.querySelector('.btn.save');
  if(!b||selId==null)return;
  const on=favs.has(selId);
  b.classList.toggle('on',on);
  b.innerHTML=on?'&hearts; Saved':'&#9825; Save';
  b.setAttribute('aria-pressed',on);
}
function renderSheet(v){
  const s=openSt(v);
  const hH=v.days.map((h,i)=>`<div class="hr-row${i===todayIdx?' tdy':''}"><span class="d">${DAYS[i]}</span>${h===null?'<span class="closed">Closed</span>':h==="v"?"Varies":h}</div>`).join('');
  const pH=v.pr.map(([l,val])=>`<div class="pr-row"><span>${l}</span><span class="v">${val}</span></div>`).join('');
  const ioL=v.io==="i"?"Indoor":v.io==="o"?"Outdoor":"Indoor + Outdoor";
  const tpL=v.tp==="p"?"Open Play":v.tp==="c"?"Classes":"Play + Classes";
  sheet.innerHTML=`
  <div class="sh-h">${bullet(v)}<div class="sh-t"><h3>${v.n}</h3><div class="cat">${v.cat} &middot; ${ioL} &middot; ${tpL}</div></div><button class="sh-x" aria-label="Close">&#x2715;</button></div>
  <div class="sh-b">
    <div class="desc">${v.d}</div>
    <div class="sh-meta"><span class="${s.o?'ok':'no'}">${s.t}</span><span>${v.t} min from home</span><span>${v.a}</span></div>
    <div class="sh-cols">
      <div><h4>Hours</h4>${hH}</div>
      <div><h4>Pricing</h4>${pH}${v.pn?`<div class="note">${v.pn}</div>`:''}</div>
    </div>
  </div>
  <div class="sh-f"><button class="btn save${favs.has(v.id)?' on':''}" aria-pressed="${favs.has(v.id)}">${favs.has(v.id)?'&hearts; Saved':'&#9825; Save'}</button><a class="btn" href="${v.w}" target="_blank" rel="noopener">Website &rarr;</a><a class="btn alt" href="https://www.google.com/maps/dir/?api=1&destination=${v.lt},${v.ln}" target="_blank" rel="noopener">Directions &rarr;</a></div>`;
  sheet.querySelector('.sh-x').onclick=closeSheet;
  sheet.querySelector('.btn.save').onclick=()=>toggleFav(v.id);
}
function select(v,from){
  clearSel();
  selId=v.id;
  const c=document.querySelector(`.vc[data-id="${v.id}"]`);
  if(c){c.classList.add('on');if(from==='map')c.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const el=MK[v.id].getElement();
  if(el&&el.firstChild)el.firstChild.classList.add('sel');
  MK[v.id].setZIndexOffset(900);
  map.flyTo([v.lt,v.ln],Math.max(map.getZoom(),14),{duration:.4});
  renderSheet(v);
  sheet.classList.add('open');
  sheet.focus({preventScroll:true});
}
map.on('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closePanel();}});

let searchQ='';

function passes(v){
  if(searchQ&&!v.n.toLowerCase().includes(searchQ)&&!v.d.toLowerCase().includes(searchQ)&&!v.cat.toLowerCase().includes(searchQ)&&!v.a.toLowerCase().includes(searchQ))return false;
  return matchF(v);
}

function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  const f=D.filter(passes);
  const fset=new Set(f.map(v=>v.id));
  if(selId!=null&&!fset.has(selId)&&sheet.classList.contains('open'))closeSheet();
  document.getElementById('count').textContent=f.length;
  D.forEach(v=>{const m=MK[v.id];const show=fset.has(v.id);if(show){if(!map.hasLayer(m))m.addTo(map);if(v.id===selId){const el=m.getElement();if(el&&el.firstChild)el.firstChild.classList.add('sel');}}else{if(map.hasLayer(m))map.removeLayer(m);}});
  if(!f.length){
    const msg=filters.fav&&!favs.size
      ?'<span>&hearts;</span>No saved stops yet.<br>Tap the &#9825; on any stop to save it.'
      :'<span>!</span>No stops match your filters.<br>Try widening the search.';
    g.innerHTML=`<div class="empty-msg" style="grid-column:1/-1">${msg}</div>`;return;
  }
  if(sortBy==="near")f.sort((a,b)=>a.t-b.t||a.id-b.id);
  else if(sortBy==="price")f.sort((a,b)=>a.$-b.$||a.t-b.t);
  else f.sort((a,b)=>a.n.localeCompare(b.n));
  f.forEach(v=>{
    const s=openSt(v);
    const io=v.io==='b'?'In + Out':v.io==='i'?'Indoor':'Outdoor';
    const tp=v.tp==='b'?'Play & Classes':v.tp==='p'?'Open Play':'Classes';
    const c=document.createElement('div');c.className='vc';c.dataset.id=v.id;c.style.setProperty('--gc',GC[grp(v)]);
    const isFav=favs.has(v.id);
    c.innerHTML=`
      <div class="vc-top">
        ${bullet(v)}
        <div class="vc-title"><button class="nm">${v.n}</button><div class="cat-line">${v.cat} &middot; ${v.a}</div></div>
        <div class="vc-price ${v.$===0?'free':''}">${fmtP(v)}</div>
        <button class="fav-btn${isFav?' on':''}" aria-label="Save ${v.n}" aria-pressed="${isFav}">${isFav?'&hearts;':'&#9825;'}</button>
      </div>
      <div class="desc-line">${v.d}</div>
      <div class="meta">
        <span class="${s.o?'ok':'no'}">${s.t}</span>
        <span>${v.t} min</span>
        <span>${io}</span>
        <span>${tp}</span>
        ${v.af?'<span>Adults too</span>':''}
      </div>`;
    if(v.id===selId)c.classList.add('on');
    c.onclick=()=>select(v,'list');
    c.querySelector('.fav-btn').onclick=e=>{e.stopPropagation();closePanel();toggleFav(v.id);};
    g.appendChild(c);
  });
  const fn=document.createElement('div');fn.className='foot-note';fn.textContent='Hours and prices drift — check the website before heading out';g.appendChild(fn);
}

// Quick-toggle + filter-count sync
function syncQuick(){
  const ot=document.getElementById('open-today');
  const otOn=filters.day===String(todayIdx);
  ot.classList.toggle('on',otOn);ot.setAttribute('aria-pressed',otOn);
  const ind=document.getElementById('io-indoor');
  ind.classList.toggle('on',filters.io==='indoor');ind.setAttribute('aria-pressed',filters.io==='indoor');
  const out=document.getElementById('io-outdoor');
  out.classList.toggle('on',filters.io==='outdoor');out.setAttribute('aria-pressed',filters.io==='outdoor');
  document.querySelectorAll('.pill[data-g="io"]').forEach(x=>x.classList.toggle('on',x.dataset.v===filters.io));
  const fr=document.getElementById('free-only');
  fr.classList.toggle('on',filters.pr===0);fr.setAttribute('aria-pressed',filters.pr===0);
  const fv=document.getElementById('fav-only');
  fv.classList.toggle('on',filters.fav);fv.setAttribute('aria-pressed',filters.fav);
  const fvc=document.getElementById('favcount');
  fvc.hidden=!favs.size;fvc.textContent=favs.size;
  const n=(filters.day!=="any")+(filters.t<99)+(filters.io!=="any")+(filters.tp!=="any")+(filters.pr<100)+(filters.af==="1");
  const fc=document.getElementById('fcount');
  fc.hidden=!n;fc.textContent=n;
}

// Filter pills
document.querySelectorAll('.pill[data-g]').forEach(b=>{b.onclick=()=>{const gr=b.dataset.g;
  if(gr==='af'){// toggle
    b.classList.toggle('on');filters.af=b.classList.contains('on')?"1":"any";
  }else{
    document.querySelectorAll(`.pill[data-g="${gr}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');
    filters[gr]=gr==='t'?parseInt(b.dataset.v):b.dataset.v;
  }
  syncQuick();render();
};});

// Mark today's day pill
const tdPill=document.querySelector(`.pill[data-g="day"][data-v="${todayIdx}"]`);
if(tdPill)tdPill.classList.add('today');

// "Open today" quick toggle mirrors the day filter
document.getElementById('open-today').onclick=()=>{
  const v=filters.day===String(todayIdx)?"any":String(todayIdx);
  filters.day=v;
  document.querySelectorAll('.pill[data-g="day"]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  syncQuick();render();
};

// Indoor / Outdoor quick toggles mirror the Space filter
document.getElementById('io-indoor').onclick=()=>{
  filters.io=filters.io==='indoor'?'any':'indoor';
  syncQuick();render();
};
document.getElementById('io-outdoor').onclick=()=>{
  filters.io=filters.io==='outdoor'?'any':'outdoor';
  syncQuick();render();
};

// "Free" quick toggle mirrors the price slider
document.getElementById('free-only').onclick=()=>{
  filters.pr=filters.pr===0?100:0;
  ps.value=filters.pr;
  pl.textContent=filters.pr===0?'Free only':'Any price';
  syncQuick();render();
};

// "Saved" quick toggle
document.getElementById('fav-only').onclick=()=>{
  filters.fav=!filters.fav;
  syncQuick();render();
};

// Surprise me — pick a random stop matching the current filters
document.getElementById('surprise').onclick=()=>{
  const f=D.filter(passes);
  if(!f.length)return;
  const v=f[Math.floor(Math.random()*f.length)];
  select(v,'map');
};

// Filters panel
const fbtn=document.getElementById('fbtn');
const fpanel=document.getElementById('fpanel');
function closePanel(){fpanel.hidden=true;fbtn.classList.remove('on');}
fbtn.onclick=()=>{fpanel.hidden=!fpanel.hidden;fbtn.classList.toggle('on',!fpanel.hidden);};
document.getElementById('fdone').onclick=closePanel;
document.addEventListener('click',e=>{if(!fpanel.hidden&&!e.target.closest('.toolbar'))closePanel();});

// Price slider
const ps=document.getElementById('price-slider');
const pl=document.getElementById('price-lbl');
ps.addEventListener('input',()=>{
  filters.pr=parseInt(ps.value);
  pl.textContent=filters.pr>=100?'Any price':filters.pr===0?'Free only':'Up to $'+filters.pr;
  syncQuick();render();
});

// Reset all (keeps category + search)
document.getElementById('freset').onclick=()=>{
  filters={...filters,day:"any",io:"any",tp:"any",pr:100,af:"any",t:99,fav:false};
  ['day','t','io','tp'].forEach(gr=>{
    const def=gr==='t'?'99':'any';
    document.querySelectorAll(`.pill[data-g="${gr}"]`).forEach(x=>x.classList.toggle('on',x.dataset.v===def));
  });
  document.querySelector('.pill[data-g="af"]').classList.remove('on');
  ps.value=100;pl.textContent='Any price';
  syncQuick();render();
};

// Sort
document.getElementById('sort').addEventListener('change',e=>{sortBy=e.target.value;render();});

// Search
const qEl=document.getElementById('q');
const qClear=document.getElementById('q-clear');
qEl.addEventListener('input',()=>{searchQ=qEl.value.toLowerCase().trim();qClear.hidden=!qEl.value;render();});
qClear.onclick=()=>{qEl.value='';searchQ='';qClear.hidden=true;qEl.focus();render();};

syncQuick();render();
</script>
</body>
</html>
